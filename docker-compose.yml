name: fms26

services:
  nginx:
    image: nginx:1.15.3
    depends_on:
      - fixmystreet
    ports:
      - "8000:80"
    volumes:
      - ./conf/nginx.conf-docker:/etc/nginx/conf.d/default.conf
    networks:
      default:
        aliases:
          - nginx.svc
  fixmystreet:
    image: fixmystreet/fixmystreet:v2.6
    tty: true
    command:
      - sh
      - -c
      - >-
        /usr/local/preinit/99-fixmystreet &&
        exec su fms -c '/var/www/fixmystreet/fixmystreet/script/server --port 9000 --env deployment'
    depends_on:
      postgres:
        condition: service_healthy
      memcached:
        condition: service_started
      mailhog:
        condition: service_started
    volumes:
      - ./conf/general.yml-docker:/var/www/fixmystreet/fixmystreet/conf/general.yml
      - ./perllib/FixMyStreet/Cobrand/Baiki.pm:/var/www/fixmystreet/cobrand/perllib/FixMyStreet/Cobrand/Baiki.pm:ro
      - ./templates/web/baiki:/var/www/fixmystreet/cobrand/templates/web/baiki
      - ./templates/email/baiki/site-name.txt:/var/www/fixmystreet/cobrand/templates/email/baiki/site-name.txt:ro
      - ./templates/email/baiki/signature.txt:/var/www/fixmystreet/cobrand/templates/email/baiki/signature.txt:ro
      - ./web/cobrands/baiki:/var/www/fixmystreet/cobrand/web/cobrands/baiki
      - ./web/i/sinar.png:/var/www/fixmystreet/fixmystreet/web/i/sinar.png:ro
      - ./web/i/TI-M_Logo.jpg:/var/www/fixmystreet/fixmystreet/web/i/TI-M_Logo.jpg:ro
      - ./web/i/isif.png:/var/www/fixmystreet/fixmystreet/web/i/isif.png:ro
      - ./perllib/FixMyStreet/Geocode.pm:/var/www/fixmystreet/fixmystreet/perllib/FixMyStreet/Geocode.pm:ro
      - ./perllib/FixMyStreet/Geocode/OSM.pm:/var/www/fixmystreet/fixmystreet/perllib/FixMyStreet/Geocode/OSM.pm:ro
    environment:
      POSTGRES_PASSWORD: 'password'
      FMS_DB_HOST: 'postgres.svc'
      FMS_DB_PASS: 'fms'
      FMS_DB_NAME: 'fixmystreet'
      FMS_DB_USER: 'fms'
      FMS_ROOT: '/var/www/fixmystreet/fixmystreet'
      SUPERUSER_EMAIL: 'superuser@example.org'
      SUPERUSER_PASSWORD: '5up3r53cr3t'
      PERL_LWP_SSL_CA_FILE: '/etc/ssl/certs/ca-certificates.crt'
      TZ: 'Asia/Kuala_Lumpur'
    networks:
      default:
        aliases:
          - fixmystreet.svc
  postgres:
    image: fixmystreet/postgres:9.6-en_GB
    restart: always
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 60
    volumes:
      - fixmystreet-pgdata:/var/lib/postgresql/data/pgdata
    environment:
      POSTGRES_PASSWORD: 'password'
      PGDATA: '/var/lib/postgresql/data/pgdata'
    networks:
      default:
        aliases:
          - postgres.svc
  memcached:
    image: memcached:1.5.10
    restart: always
    networks:
      default:
        aliases:
          - memcached.svc
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "8025:8025"
    networks:
      default:
        aliases:
          - mailhog.svc

volumes:
  fixmystreet-pgdata:
